name: Compilar e testar Resultados TV
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'LICENSE', 'PRIVACY.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar, verificar o parser e executar lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Guardar APK sem assinatura para assinatura privada
        run: |
          mkdir -p dist/unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/unsigned/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/unsigned/
          git rev-parse HEAD > dist/unsigned/source-commit.txt
          sha256sum dist/unsigned/*.apk > dist/unsigned/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Resultados-TV-unsigned
          path: dist/unsigned/
          retention-days: 14
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar com controle remoto em Android TV 720p
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_720p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: bash tools/verify_tv.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultados-TV-QA
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            dist/qa/
          retention-days: 30
